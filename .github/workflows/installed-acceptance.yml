name: Official host acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: limecloud/hetu
          ref: b75293837aaa220803b9dc964ba72b8646fa7244
          path: host
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wordflowlab/hetu-nonfiction-studio
          ref: f0ba96053b19651c0de19362e02fc35c1851597a
          path: hetu-nonfiction-studio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wordflowlab/hetu-biography-studio
          ref: e19d82c12ba2d456892e3dd123cd91d39eca992e
          path: hetu-biography-studio
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.0.0'
      - name: Install test dependencies without compiling host
        run: |
          (cd host && npm ci)
          (cd plugin && npm ci)
          (cd hetu-nonfiction-studio && npm ci && npm run package)
          (cd hetu-biography-studio && npm ci && npm run package)
      - name: Install browser for offline artifacts
        working-directory: plugin
        run: npx playwright install chromium
      - name: Build fixed plugin only
        working-directory: plugin
        run: |
          npm run build
          npm run check
          npm run test:unit
          npm run package
      - name: Verify signed host and exact plugin package
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/accept-installed.py
      - name: Retain actual work surfaces and acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-installed-acceptance
          path: |
            plugin/output/installed-acceptance/*.json
            plugin/output/installed-acceptance/*.html
            plugin/output/installed-acceptance/*.epub
            plugin/output/installed-acceptance/*.pdf
            plugin/output/installed-acceptance/*.wav
            plugin/output/installed-acceptance/*.srt
            plugin/output/installed-acceptance/*.vtt
            plugin/output/installed-acceptance/*.ass
            plugin/output/installed-acceptance/*.png
            plugin/output/installed-acceptance/*.log
            plugin/test-results/
          if-no-files-found: ignore
          retention-days: 30
